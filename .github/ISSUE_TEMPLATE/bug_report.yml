name: Bug report
description: Something broken in the self-host core
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Search existing issues first.
        Marketing/SEO bugs belong on the Cloud site, not this repo.
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: Clear and concise
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 0.1.0 or git SHA
  - type: dropdown
    id: deploy
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Railway
        - VPS / bare metal
        - Local dev
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
